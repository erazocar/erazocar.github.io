<a class="card hoverable repo-card repo-user" href="https://github.com/{{ include.username }}" data-user="{{ include.username }}">
  <div class="card-body">
    <img class="repo-avatar" src="{{ 'assets/img/prof_pic.jpg' | relative_url }}" alt="{{ site.first_name }} {{ site.last_name }}" width="72" height="72">
    <div>
      <div class="repo-name">{{ site.first_name }} {{ site.last_name }}</div>
      <p class="repo-desc"><i class="fab fa-github"></i> github.com/{{ include.username }}</p>
      <div class="repo-meta"><span class="user-repos"></span><span class="user-followers"></span></div>
    </div>
  </div>
</a>
