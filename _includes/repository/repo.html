{%- assign parts = include.repository | split: '/' -%}
<a class="card hoverable repo-card" href="https://github.com/{{ include.repository }}" data-repo="{{ include.repository }}">
  <div class="card-body">
    <div class="repo-name"><i class="fab fa-github"></i> {% unless site.data.repositories.github_users contains parts.first %}{{ parts.first }}/{% endunless %}{{ parts.last }}</div>
    <p class="repo-desc">{{ include.desc }}</p>
    <div class="repo-meta"><span class="repo-lang"></span><span class="repo-stars"></span></div>
  </div>
</a>
