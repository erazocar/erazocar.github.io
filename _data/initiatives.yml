# Initiatives shown on the projects page, in order.
- title: HydroSuite
  role: Core team member
  years: 2023 - now
  text: Community-driven, open-source ecosystem of 20+ web libraries for hydrological education, research and operations, with working groups and open governance. Home of HydroLang, HydroCompute, HydroRTC, HydroBlox and more.
  url: https://hydroinformatics.tulane.edu/lab/hydrosuite/
  link: Visit HydroSuite

- title: NSF POSE · OSE-HERO
  role: Entrepreneurial Lead
  years: 2024 - now
  text: NSF Pathways to Enable Open-Source Ecosystems (Phase I) award to grow HydroSuite into a sustainable open-source ecosystem of next-generation web technologies for hydrological education, research and operations.
  url: https://hydroinformatics.tulane.edu/lab/hydrosuite/
  link: About OSE-HERO

- title: SELAAF Hydrologic Data Network
  role: Development team
  years:
  text: Data infrastructure for the Southeast Louisiana Adaptation Forum, cataloging hydrologic datasets, planning documents and regulatory guidance from agencies such as USGS, NOAA, USACE and the Sewerage & Water Board, with provenance, access and lineage in one place. With the Greater New Orleans Foundation and the National Academy of Sciences.
  url: https://hydroinformatics.tulane.edu/lab/sela/
  link: Visit SELAAF

- title: WaterSoftHack
  role: Fellow and trainer
  years: 2024 - now
  text: NSF cybertraining program in reproducible data science, machine learning, and cloud and edge computing for water science. Delivered the HydroSuite data-analytics training and co-authored the program's outcomes paper.
  url: https://doi.org/10.5194/egusphere-2026-491
  link: Program paper

- title: University of Iowa Hackathon
  role: Vice Chair
  years: 2022 - now
  text: Helps organize the university-wide hackathon, including its work on bringing generative AI into hackathons.
  url: https://doi.org/10.3390/bdcc8120188
  link: Related paper
